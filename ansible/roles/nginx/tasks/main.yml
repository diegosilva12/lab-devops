---
- name: Garantir que o Nginx esteja instalado
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Garantir que o Nginx esteja iniciado e habilitado
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Publicar pagina do laboratorio
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'

- name: Configurar identificacao do laboratorio no Nginx
  ansible.builtin.copy:
    content: |
      # Managed by Ansible - DevOps Lab
      add_header X-Lab-Environment "devops-lab" always;
    dest: /etc/nginx/conf.d/lab.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Validar configuracao do Nginx
    - Recarregar Nginx

- name: Verificar status do Nginx
  ansible.builtin.command:
    cmd: systemctl is-active nginx
  register: nginx_status
  changed_when: false

- name: Informar que o Nginx esta ativo
  ansible.builtin.debug:
    msg: "Nginx esta ativo no servidor {{ inventory_hostname }}"
  when: nginx_status.stdout == "active"

- name: Criar diretorios do laboratorio
  ansible.builtin.file:
    path: "/opt/devops-lab/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - scripts
    - backups
    - logs
