- name: Configurar servidor web
  hosts: app
  become: true

  tasks:
    - name: Garantir que o Nginx esteja instalado
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Garantir que o Nginx esteja iniciado e habilitado
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Publicar pagina do laboratorio
      ansible.builtin.copy:
        content: |
          <h1>Laboratorio DevOps - Diego</h1>
          <p>Servidor configurado com Ansible.</p>
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: '0644'
