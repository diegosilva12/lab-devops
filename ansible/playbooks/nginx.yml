- name: Configurar servidor web
  hosts: app
  become: true

  vars:
    titulo: "Laboratorio DevOps - Diego"
    mensagem: "Servidor configurado com Ansible e Jinja2."

  tasks:
    - name: Garantir que o Nginx esteja instalado
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Garantir que o Nginx esteja iniciado e habilitado
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Publicar pagina do laboratorio
      ansible.builtin.template:
        src: ../templates/index.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: '0644'

    - name: Configurar identificacao do laboratorio no Nginx
      ansible.builtin.copy:
        content: |
          # Managed by Ansible - DevOps Lab
          add_header X-Lab-Environment "devops-lab" always;
        dest: /etc/nginx/conf.d/lab.conf
        owner: root
        group: root
        mode: '0644'
      notify:
        - Validar configuracao do Nginx
        - Recarregar Nginx

  handlers:
    - name: Validar configuracao do Nginx
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Recarregar Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
